services:
  postgres:
    image: postgres:alpine
    environment:
      - POSTGRES_USER=logmon
      - POSTGRES_PASSWORD=123456
      - POSTGRES_DB=logmon_db
    ports:
      - "5555:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:alpine
    ports:
      - "6380:6379"
    volumes:
      - redis_data:/data

volumes:
  postgres_data:
  redis_data: